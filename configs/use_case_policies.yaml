customer_support_chatbot:
  name: customer_support_chatbot
  description: Customer facing bot, latency sensitive
  consequence_level: "medium"
  latency_budget_ms: 400
  checker_budget:
    performance:
      tier0_uncertain_band: [0.30, 0.70]
      selfcheck_num_samples: 2
      max_tier1_calls_per_response: 1
    pii:
      tier0_mode: "pattern_only_unless_hit"
    bias:
      check_frequency: "every_4th_window"
    regenerate:
      max_attempts: 1
  char_iou_threshold: 0.3
  cosine_threshold: 0.62
  max_overall_risk: 0.8
  checker_thresholds:
    performance: 0.6
    safety: 0.3
    bias: 0.5
    pii: 0.4
  block_on_overlap: true
  redact_pii: true
  performance_n_samples: 2
  performance_sampling_temperature: 1.0
  performance_nli_weight: 0.7
  performance_bertscore_weight: 0.3
  pii_entity_allowlist:
  - EMAIL
  - EMAIL_ADDRESS
  - PHONE_NUMBER
  - PHONE
  - CREDIT_CARD
  - SSN
  - US_SSN
  - PERSON
  pii_min_confidence: 0.6
  alpha_low: 0.05
  alpha_high: 0.01
  modify_span_threshold_pct: 25.0
  pii_tier0_mode: pattern_only_unless_hit
  safety_checker_always_judge: false
  bias_checker_always_judge: false
  bias_check_frequency: every_4th_window
  session_drift_window_size: 5
  session_drift_threshold: 0.55
  session_require_monotonic_trend: true
  session_cumulative_pii_threshold: 3
  session_escalation_action: HUMAN
  calibrated_thresholds:
    performance:
      tau_low: 0.967
      tau_high: 0.981
    safety:
      tau_low: 0.972
      tau_high: 0.988
    bias:
      tau_low: 0.97
      tau_high: 0.986
    pii:
      tau_low: 0.988
      tau_high: 0.999
  calibration_n: 79
internal_knowledge_assistant:
  name: internal_knowledge_assistant
  description: Internal bot, favors accuracy over latency
  consequence_level: "high"
  latency_budget_ms: 3000
  checker_budget:
    performance:
      tier0_uncertain_band: [0.15, 0.85]
      selfcheck_num_samples: 5
      max_tier1_calls_per_response: null
    pii:
      tier0_mode: "always_full_ner"
    bias:
      check_frequency: "every_window"
    regenerate:
      max_attempts: 2
  char_iou_threshold: 0.3
  cosine_threshold: 0.62
  max_overall_risk: 0.7
  checker_thresholds:
    performance: 0.4
    safety: 0.2
    bias: 0.35
    pii: 0.25
  block_on_overlap: true
  redact_pii: false
  performance_n_samples: 5
  performance_sampling_temperature: 1.0
  performance_nli_weight: 0.7
  performance_bertscore_weight: 0.3
  pii_entity_allowlist:
  - SSN
  - US_SSN
  - CREDIT_CARD
  pii_min_confidence: 0.75
  alpha_low: 0.15
  alpha_high: 0.05
  modify_span_threshold_pct: 40.0
  pii_tier0_mode: always_full_ner
  safety_checker_always_judge: true
  bias_checker_always_judge: true
  bias_check_frequency: every_window
  session_drift_window_size: 5
  session_drift_threshold: 0.55
  session_require_monotonic_trend: true
  session_cumulative_pii_threshold: 3
  session_escalation_action: HUMAN
  calibrated_thresholds:
    performance:
      tau_low: 0.913
      tau_high: 0.967
    safety:
      tau_low: 0.902
      tau_high: 0.972
    bias:
      tau_low: 0.91
      tau_high: 0.97
    pii:
      tau_low: 0.93
      tau_high: 0.988
  calibration_n: 79
