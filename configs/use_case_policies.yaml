customer_support_chatbot:
  name: customer_support_chatbot
  description: "Customer facing bot, latency sensitive"
  max_overall_risk: 0.8
  checker_thresholds:
    performance: 0.60
    safety: 0.30
    bias: 0.50
    pii: 0.40
  block_on_overlap: true
  redact_pii: true
  performance_n_samples: 2
  performance_sampling_temperature: 1.0
  performance_nli_weight: 0.7
  performance_bertscore_weight: 0.3
  pii_entity_allowlist: ["EMAIL", "EMAIL_ADDRESS", "PHONE_NUMBER", "PHONE", "CREDIT_CARD", "SSN", "US_SSN", "PERSON"]
  pii_min_confidence: 0.6

internal_knowledge_assistant:
  name: internal_knowledge_assistant
  description: "Internal bot, favors accuracy over latency"
  max_overall_risk: 0.7
  checker_thresholds:
    performance: 0.40
    safety: 0.20
    bias: 0.35
    pii: 0.25
  block_on_overlap: true
  redact_pii: false
  performance_n_samples: 5
  performance_sampling_temperature: 1.0
  performance_nli_weight: 0.7
  performance_bertscore_weight: 0.3
  pii_entity_allowlist: ["SSN", "US_SSN", "CREDIT_CARD"]
  pii_min_confidence: 0.75
